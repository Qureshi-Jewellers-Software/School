<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<title>School Manager (Demo)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{color-scheme:light;--p:#1b5e9b;--p2:#e8f1fa;--ok:#1e8e4e;--okb:#e5f5ec;--bad:#c0392b;--badb:#fbeaea;--warn:#b7791f;--warnb:#fdf3e1;--tx:#1d2733;--mut:#66727f;--bd:#dde3ea;--bg:#f4f6f9;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--p);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header small{opacity:.8;font-size:12px;display:block}
main{padding:14px;max-width:900px;margin:0 auto;padding-bottom:90px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:11px;color:var(--mut);cursor:pointer}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.on{color:var(--p);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--mut)}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.btn{border:0;background:var(--p);color:#fff;padding:10px 14px;border-radius:9px;font-size:14px;cursor:pointer;font-weight:600}
.btn.sec{background:var(--p2);color:var(--p)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;font-size:16px;background:#fff !important;color:#1d2733 !important;-webkit-text-fill-color:#1d2733;caret-color:#1b5e9b}
input::placeholder{color:#8a96a3;-webkit-text-fill-color:#8a96a3}
.pw{position:relative}.pw input{padding-right:46px}.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;padding:6px 8px;cursor:pointer}
label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.list .it:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--p2);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.t-ok{background:var(--okb);color:var(--ok)}.t-bad{background:var(--badb);color:var(--bad)}.t-warn{background:var(--warnb);color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.modal .box{border-radius:16px}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:9px;z-index:30;font-size:14px}
.login{max-width:380px;margin:40px auto}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--p);color:#fff;border-color:var(--p)}
.cdd{margin-bottom:10px}
.cdd .cbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:9px;padding:11px 12px;font-size:15px;cursor:pointer;color:var(--tx)}
.cdd .cbtn b{color:var(--p)}
.cdd .clist{display:none;background:#fff;border:1px solid var(--bd);border-radius:9px;margin-top:6px;overflow:hidden}
.cdd.open .clist{display:block}
.cdd .clist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:#fff;padding:11px 14px;font-size:15px;cursor:pointer;color:var(--tx)}
.cdd .clist button:last-child{border-bottom:0}
.cdd .clist button.on{background:var(--p2);color:var(--p);font-weight:700}
body.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",system-ui,sans-serif;line-height:1.9}
body.ur input,body.ur select,body.ur button{font-family:inherit}
body.ur .idc,body.ur .vch{font-family:"Noto Naskh Arabic",Arial,sans-serif;line-height:1.25}
body.ur .chips,body.ur nav button{line-height:1.6}
.lsel{width:auto;padding:5px 6px;font-size:13px;border-radius:7px;border:0;background:rgba(255,255,255,.95) !important}
input[inputmode=numeric],input[type=time]{direction:ltr}
body.ur input[inputmode=numeric]{text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
.big{font-size:44px;text-align:center;margin:6px 0}
#reader{width:100%}
/* Voucher */
.vwrap{display:flex;flex-direction:column;gap:10px}
.vch{border:1.5px dashed #555;padding:10px 12px;font-size:12.5px;background:#fff;color:#000}
.vch .vh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:6px}
.vch .vh b{font-size:15px}
.vch table td{padding:3px 4px;border-bottom:1px solid #ccc}
.vch .copy{font-size:11px;font-weight:700;border:1px solid #000;padding:1px 6px}
.vch .tot td{font-weight:700;border-top:1.5px solid #000}
#printArea{display:none}
.idc{width:85.6mm;height:54mm;border:1px solid #999;border-radius:3mm;overflow:hidden;background:#fff;color:#111;font-family:Arial,sans-serif;display:flex;flex-direction:column;box-sizing:border-box}
.idc .ih{flex:none;background:#1b5e9b;color:#fff;padding:1.3mm 3mm;display:flex;justify-content:space-between;align-items:center}
.idc.tc .ih{background:#1e8e4e}
.idc .ih b{font-size:3.6mm}.idc .ih span{font-size:2.4mm;font-weight:700;border:1px solid #fff;border-radius:1mm;padding:.3mm 1.2mm}
.idc .ib{display:flex;gap:2.5mm;padding:1.5mm 3mm 0;flex:1;min-height:0}
.idc .ip{width:17mm;height:21mm;border:1px solid #bbb;border-radius:1.5mm;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-size:8mm;color:#1b5e9b;background:#e8f1fa}
.idc .ip img{width:100%;height:100%;object-fit:cover}
.idc .id{font-size:2.4mm;line-height:1.28;flex:1;min-width:0}
.idc .id .nm{font-size:3.4mm;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idc .id .bg{display:inline-block;background:#c0392b;color:#fff;font-weight:700;border-radius:1mm;padding:0 1.2mm}
.idc .bcw{text-align:center;padding:0 3mm .6mm;flex:none}.idc .bcw svg{height:8.5mm;max-width:100%}
.idc .ft{flex:none;font-size:2.1mm;text-align:center;background:#f1f3f5;padding:.6mm}
.cardgrid{display:grid;grid-template-columns:repeat(2,85.6mm);gap:3mm;justify-content:center}
@page{size:A4;margin:8mm}
@media print{
 body{background:#fff !important}
 body *{visibility:hidden}
 #printArea,#printArea *{visibility:visible}
 #printArea{display:block;position:absolute;left:0;top:0;width:100%}
 .vch{page-break-inside:avoid}
 .pbreak{page-break-after:always}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
/* ============ DATA (demo: is phone/browser mein; baad mein Supabase) ============ */
const CLASSES=["Play Group","Nursery","Prep (KG)","Class 1","Class 2","Class 3","Class 4","Class 5","Class 6","Class 7","Class 8","Class 9","Class 10"];
const KEY="school_demo_v1";
let mem=null;
function uid(){return Math.random().toString(36).slice(2,10)}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function ym(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function monthName(m){const [y,mm]=m.split("-");return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+mm-1]+" "+y}
function rs(n){return "Rs "+Number(n||0).toLocaleString("en-PK")}
function seed(){
  const s=[["Ali Raza","Muhammad Raza","03001234567","Class 5",3500],["Fatima Raza","Muhammad Raza","03001234567","Class 2",3000],["Hamza Raza","Muhammad Raza","03001234567","Nursery",2500],
  ["Ayesha Khan","Imran Khan","03111222333","Class 8",4000],["Usman Ahmed","Tariq Ahmed","03214445566","Class 10",4500],["Zainab Bibi","Abdul Ghani","03337778899","Prep (KG)",2500],["Bilal Hussain","Akhtar Hussain","03451112223","Class 5",3500]];
  const students=s.map((x,i)=>({id:uid(),name:x[0],father:x[1],phone:x[2],cls:x[3],roll:String(i+1),fee:x[4],discount:x[1]==="Muhammad Raza"&&i>0?300:0,photo:"",adm:today()}));
  const teachers=[{id:uid(),name:"Sana Malik",phone:"03009990001",subject:"English",salary:25000,pin:"1111"},{id:uid(),name:"Kashif Iqbal",phone:"03009990002",subject:"Maths",salary:28000,pin:"2222"},{id:uid(),name:"Nadia Parveen",phone:"03009990003",subject:"Urdu",salary:22000,pin:"3333"}];
  return {settings:{school:"Demo School",address:"Main Road, Karachi",phone:"0300-0000000",dueDay:10,fine:200,start:"08:00",grace:10,lat:null,lng:null,radius:150,qr:"SCH-"+uid().toUpperCase(),gpsOn:true,adminUser:"Admin",adminPin:"1234"},students,teachers,fees:[],tatt:[],rcpt:1000};
}
function load(){try{const t=localStorage.getItem(KEY);if(t){mem=JSON.parse(t);return}}catch(e){}mem=seed();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}}
load();
const BLOODS=["","A+","A-","B+","B-","AB+","AB-","O+","O-"];
function bloodSel(id,v){return `<select id="${id}">${BLOODS.map(b=>`<option value="${b}" ${b===(v||"")?"selected":""}>${b||"Pata nahi"}</option>`).join("")}</select>`}
function nextCode(pre,list){let n=pre==="S"?1000:100;list.forEach(x=>{const k=parseInt(String(x.code||"").slice(1));if(k>n)n=k});return pre+(n+1)}
(function(){let ch=0;mem.students.forEach(s=>{if(!s.code){s.code=nextCode("S",mem.students);ch=1}});mem.teachers.forEach(t=>{if(!t.code){t.code=nextCode("T",mem.teachers);ch=1}});if(ch)save()})();
if(mem.settings.adminUser==="admin"){mem.settings.adminUser="Admin";save()}
let S={user:null,tab:"dash",cls:"Sab",month:ym(),q:""};
try{const u=localStorage.getItem("school_user");if(u)S.user=JSON.parse(u)}catch(e){}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function modal(html){closeModal();const m=document.createElement("div");m.className="modal";m.id="mdl";m.innerHTML='<div class="box">'+html+'</div>';m.addEventListener("click",e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=$("#mdl");if(m)m.remove();stopScan()}
function ask(msg,yes){modal('<h3>'+esc(msg)+'</h3><div class="row"><button class="btn sec sp" onclick="closeModal()">Nahi</button><button class="btn bad sp" id="yesB">Haan</button></div>');$("#yesB").onclick=()=>{closeModal();yes()}}
function avatar(st){return '<div class="av">'+(st.photo?'<img src="'+st.photo+'">':esc((st.name||"?")[0]))+'</div>'}
function waNum(p){p=String(p||"").replace(/\D/g,"");if(p.startsWith("0"))p="92"+p.slice(1);return p}
function netFee(st){return Math.max(0,(+st.fee||0)-(+st.discount||0))}
function dueDate(m){return m+"-"+String(mem.settings.dueDay).padStart(2,"0")}

/* ============ LOGIN ============ */
function viewLogin(){
  return `<div class="login"><div class="card"><h2 style="text-align:center">🏫 ${esc(mem.settings.school)}</h2>
  <div class="chips" style="justify-content:center"><button class="on" id="lA" onclick="lt('a')">Admin / Office</button><button id="lT" onclick="lt('t')">Teacher</button></div>
  <div id="lf"></div></div>
  <p class="mut" style="text-align:center">Demo Teacher: 03009990001 / PIN 1111</p></div>`;
}
function lt(k){$("#lA").classList.toggle("on",k==="a");$("#lT").classList.toggle("on",k==="t");
  $("#lf").innerHTML=k==="a"?`<label>User</label><input id="lu" value=""><label>PIN</label><div class="pw"><input id="lp" type="password" inputmode="numeric"><button type="button" class="eye" onclick="eye(this)">👁️</button></div><br><br><button class="btn full" onclick="doLogin('a')">Login</button>`
  :`<label>Mobile number</label><input id="lu" inputmode="numeric"><label>PIN</label><div class="pw"><input id="lp" type="password" inputmode="numeric"><button type="button" class="eye" onclick="eye(this)">👁️</button></div><br><br><button class="btn full" onclick="doLogin('t')">Login</button>`}
function eye(b){const i=b.previousElementSibling;const sh=i.type==="password";i.type=sh?"text":"password";b.textContent=sh?"🙈":"👁️"}
function doLogin(k){const u=$("#lu").value.trim(),p=$("#lp").value.trim();
  if(k==="a"){if(u===mem.settings.adminUser&&p===mem.settings.adminPin){S.user={role:"admin"}}else return toast("Ghalat user ya PIN")}
  else{const t=mem.teachers.find(t=>t.phone===u&&t.pin===p);if(!t)return toast("Ghalat number ya PIN");S.user={role:"teacher",id:t.id}}
  try{localStorage.setItem("school_user",JSON.stringify(S.user))}catch(e){}
  S.tab=S.user.role==="admin"?"dash":"tcheck";render()}
function logout(){S.user=null;try{localStorage.removeItem("school_user")}catch(e){}render()}

/* ============ DASHBOARD ============ */
function viewDash(){
  const m=ym(),fs=mem.fees.filter(f=>f.month===m);
  const exp=fs.reduce((a,f)=>a+f.total,0),got=fs.filter(f=>f.status==="paid").reduce((a,f)=>a+f.total,0);
  const td=today(),att=mem.tatt.filter(a=>a.date===td);
  const pres=att.length,late=att.filter(a=>a.late).length,abs=mem.teachers.length-pres;
  const unpaid=fs.filter(f=>f.status!=="paid").slice(0,6);
  return `<h2>Assalam o Alaikum 👋</h2>
  <div class="grid">
   <div class="stat"><div class="n">${mem.students.length}</div><div class="l">Kul students</div></div>
   <div class="stat"><div class="n">${mem.teachers.length}</div><div class="l">Teachers</div></div>
   <div class="stat"><div class="n" style="color:var(--ok)">${rs(got)}</div><div class="l">${monthName(m)} fee mili</div></div>
   <div class="stat"><div class="n" style="color:var(--bad)">${rs(exp-got)}</div><div class="l">Baqaya</div></div>
  </div><br>
  <div class="card"><h3>Aaj teachers ki haazri</h3><div class="row">
   <span class="tag t-ok">Haazir ${pres-late}</span><span class="tag t-warn">Late ${late}</span><span class="tag t-bad">Ghair-haazir ${abs}</span><span class="sp"></span>
   <button class="btn sm sec" onclick="go('teach')">Detail</button></div></div>
  <div class="card"><h3>Fee baqaya (${monthName(m)})</h3>
   ${!fs.length?'<p class="mut">Is mahine ke voucher abhi nahi bane.</p><button class="btn" onclick="go(\'fees\')">Voucher banayein</button>':
   unpaid.length?'<div class="list">'+unpaid.map(f=>{const st=stu(f.sid);return st?`<div class="it">${avatar(st)}<div class="sp"><b>${esc(st.name)}</b><div class="mut">${esc(st.cls)}</div></div><b>${rs(f.total)}</b></div>`:""}).join("")+'</div>':'<p class="mut">Sab ne fee de di ✅</p>'}
  </div>`;
}

/* ============ STUDENTS ============ */
function clsPicker(){return `<div class="cdd" id="cdd"><button class="cbtn" onclick="this.parentNode.classList.toggle('open')"><span>Class: <b>${S.cls==="Sab"?"Sab classes":S.cls}</b></span><span>▾</span></button>
  <div class="clist">${["Sab",...CLASSES].map(c=>`<button class="${S.cls===c?"on":""}" onclick="S.cls='${c}';render()">${c==="Sab"?"Sab classes":c}${S.cls===c?" ✓":""}</button>`).join("")}</div></div>`}

function stu(id){return mem.students.find(s=>s.id===id)}
function viewStudents(){
  let L=mem.students.filter(s=>(S.cls==="Sab"||s.cls===S.cls)&&(!S.q||(s.name+s.father+s.phone).toLowerCase().includes(S.q.toLowerCase())));
  L.sort((a,b)=>CLASSES.indexOf(a.cls)-CLASSES.indexOf(b.cls)||a.name.localeCompare(b.name));
  return `<div class="row"><h2 class="sp">Students (${L.length})</h2><button class="btn" onclick="editStu()">+ Naya admission</button></div>
  <div class="row" style="margin-bottom:10px"><button class="btn sec sm" onclick="showCards('s',curStuIds())">🪪 ${S.cls==="Sab"?"Sab students":S.cls} ke card print</button></div>
  <input placeholder="🔍 Naam ya number se dhoondein" value="${esc(S.q)}" oninput="S.q=this.value;rerenderList()"><br><br>
  ${clsPicker()}
  <div class="card list" id="sl">${L.map(s=>{const sib=mem.students.filter(x=>x.phone===s.phone).length;return `<div class="it" onclick="editStu('${s.id}')" style="cursor:pointer">${avatar(s)}<div class="sp"><b>${esc(s.name)}</b><div class="mut">${esc(s.cls)} · Roll ${esc(s.roll)} · ${esc(s.father)}${sib>1?' · <span class="tag t-warn">'+sib+' bhai/behan</span>':''}</div></div><div style="text-align:right"><b>${rs(netFee(s))}</b><div class="mut">mahana</div></div></div>`}).join("")||'<p class="mut">Koi student nahi.</p>'}</div>`;
}
function curStuIds(){return mem.students.filter(s=>S.cls==="Sab"||s.cls===S.cls).sort((a,b)=>CLASSES.indexOf(a.cls)-CLASSES.indexOf(b.cls)||(+a.roll||0)-(+b.roll||0)).map(s=>s.id)}
function rerenderList(){const v=S.q;render();const i=document.querySelector('input[placeholder^="🔍"]');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
let tmpPhoto="";
function editStu(id){
  const s=id?stu(id):{name:"",father:"",phone:"",cls:S.cls!=="Sab"?S.cls:"Class 1",roll:"",fee:"",discount:0,photo:""};tmpPhoto=s.photo||"";
  modal(`<h3>${id?"Student edit":"Naya admission"}</h3>
  <div class="row"><div class="av" id="pv" style="width:72px;height:72px">${tmpPhoto?'<img src="'+tmpPhoto+'">':"📷"}</div>
  <label class="btn sec sm" style="color:var(--p);margin:0">Photo lagayein<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label></div>
  <label>Student ka naam</label><input id="sn" value="${esc(s.name)}">
  <label>Waalid ka naam</label><input id="sf" value="${esc(s.father)}">
  <label>Waalid ka mobile (parents login isi se hoga)</label><input id="sp" inputmode="numeric" value="<bdi dir="ltr">${esc(s.phone)}</bdi>">
  <div class="f2"><div><label>Class</label><select id="sc">${CLASSES.map(c=>`<option ${c===s.cls?"selected":""}>${c}</option>`).join("")}</select></div>
  <div><label>Roll no.</label><input id="sr" value="${esc(s.roll)}"></div>
  <div><label>Mahana fee</label><input id="sfe" inputmode="numeric" value="${esc(s.fee)}"></div>
  <div><label>Riayat / Discount</label><input id="sd" inputmode="numeric" value="${esc(s.discount)}"></div>
  <div><label>Blood group</label>${bloodSel("sb",s.blood)}</div></div><br>
  <div class="row">${id?`<button class="btn bad sm" onclick="delStu('${id}')">Delete</button><button class="btn sec sm" onclick="showCards('s',['${id}'])">🪪 Card</button>`:""}<span class="sp"></span><button class="btn sec" onclick="closeModal()">Wapas</button><button class="btn" onclick="saveStu('${id||""}')">Save</button></div>`);
}

function genVouchers(){

let scanner=null;
function stopScan(){if(scanner){try{scanner.stop().catch(()=>{})}catch(e){}scanner=null}}
function viewTCheck(){const t=tch(S.user.id);if(!t)return"";const a=mem.tatt.find(x=>x.tid===t.id&&x.date===today());
  return `<div class="card" style="text-align:center"><h2>Assalam o Alaikum, ${esc(t.name)}</h2><p class="mut">${new Date().toLocaleDateString(LANG==="ur"?"ur-PK":"en-PK",{weekday:"long",day:"numeric",month:"long"})}</p>
  <div class="big">${a?(a.out?"🏠":"✅"):"⏰"}</div>
  <p>${a?`Aap aaye: <b>${hm(a.in)}</b>${a.late?' <span class="tag t-warn">Late</span>':''}${a.out?`<br>Aap gaye: <b>${hm(a.out)}</b>`:""}`:"Aaj ki haazri abhi nahi lagi"}</p>
  ${!a?`<button class="btn full ok" onclick="startCheck('in')">📷 QR scan karke Check-in</button>`:!a.out?`<button class="btn full" onclick="startCheck('out')">📷 QR scan karke Check-out</button>`:""}</div>
  <div class="card"><h3>Is mahine</h3>${(()=>{const L=mem.tatt.filter(x=>x.tid===t.id&&x.date.startsWith(ym()));return `<p>Haazir: <b>${L.length}</b> din · Late: <b>${L.filter(x=>x.late).length}</b></p>`})()}</div>`}
function startCheck(kind){
  modal(`<h3>School ka QR code scan karein</h3><div id="reader"></div><p class="mut" id="gpsS">📍 Location check ho rahi hai...</p>
  <details><summary class="mut">Camera nahi chal raha?</summary><label>QR ke neeche likha code</label><input id="mc"><br><br><button class="btn sm" onclick="gotCode($('#mc').value.trim(),'${kind}')">Check</button></details><br>
  <button class="btn sec full" onclick="closeModal()">Wapas</button>`);
  getPos();
  try{scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:220},txt=>{stopScan();gotCode(txt,kind)},()=>{}).catch(()=>{$("#reader").innerHTML='<p class="mut">Camera nahi khula. Neeche code likh dein.</p>'})}catch(e){$("#reader").innerHTML='<p class="mut">Camera nahi khula. Neeche code likh dein.</p>'}
}
let lastPos=null;
function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(cb){lastPos=null;if(!navigator.geolocation){const g=$("#gpsS");if(g)g.textContent="📍 Is phone par GPS nahi";return}
  navigator.geolocation.getCurrentPosition(p=>{lastPos=p.coords;const g=$("#gpsS");if(g)g.textContent="📍 Location mil gayi ("+Math.round(p.coords.accuracy)+"m)";cb&&cb(p.coords)},()=>{const g=$("#gpsS");if(g)g.textContent="📍 Location nahi mili. Phone ki location ON karein.";cb&&cb(null)},{enableHighAccuracy:true,timeout:15000})}
function gotCode(txt,kind){const s=mem.settings;
  if(txt!==s.qr){toast("❌ Ye school ka QR nahi");return}
  if(s.gpsOn){if(s.lat==null){toast("Admin ne abhi school ki location save nahi ki");}
   else{if(!lastPos){toast("Location ka intezar... dobara koshish karein");getPos();return}
    const d=dist(s.lat,s.lng,lastPos.latitude,lastPos.longitude);if(d>s.radius){toast("❌ Aap school se "+Math.round(d)+"m door hain");return}}}
  const td=today(),now=new Date();let a=mem.tatt.find(x=>x.tid===S.user.id&&x.date===td);
  if(kind==="in"&&!a){const [h,m]=s.start.split(":").map(Number);const lim=new Date();lim.setHours(h,m+ +s.grace,0,0);mem.tatt.push({id:uid(),tid:S.user.id,date:td,in:now.toISOString(),late:now>lim})}
  else if(kind==="out"&&a){a.out=now.toISOString()}
  save();closeModal();toast("✅ Haazri lag gayi");render()}

const _phRe=new RegExp("(?<![A-Za-z])("+_phKeys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![A-Za-z])","g");
function trs(str){if(LANG==="ru"||!str)return str;const i=LANG==="ur"?0:1;const t=str.trim();if(TX_EXACT[t])return str.replace(t,TX_EXACT[t][i]);return str.replace(_phRe,m=>TX_PHRASE[m][i])}
let _trBusy=false;
function translateNode(root){if(LANG==="ru"||!root)return;_trBusy=true;
  if(root.nodeType===3){const v=trs(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v}
  else if(root.nodeType===1){if(root.closest&&root.closest("script,style,.notr"))return _trBusy=false;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentNode.closest(".notr,script,style"))continue;const v=trs(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}
    (root.matches&&root.matches("[placeholder]")?[root]:[]).concat([...root.querySelectorAll("[placeholder]")]).forEach(e=>{const v=trs(e.placeholder);if(v!==e.placeholder)e.placeholder=v})}
  _trBusy=false}
new MutationObserver(ms=>{if(_trBusy||LANG==="ru")return;ms.forEach(m=>{if(m.type==="characterData")translateNode(m.target);else m.addedNodes.forEach(translateNode)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
function applyDir(){const h=document.documentElement;h.dir=LANG==="ur"?"rtl":"ltr";h.lang=LANG==="ur"?"ur":"en";document.body.classList.toggle("ur",LANG==="ur")}
function setLang(l){LANG=l;try{localStorage.setItem("school_lang",l)}catch(e){}applyDir();render();translateNode($("#printArea"))}
function langSel(){return `<select class="lsel notr" onchange="setLang(this.value)"><option value="ru" ${LANG==="ru"?"selected":""}>Roman Urdu</option><option value="ur" ${LANG==="ur"?"selected":""}>اردو</option><option value="en" ${LANG==="en"?"selected":""}>English</option></select>`}

  const v={dash:viewDash,stu:viewStudents,fees:viewFees,teach:viewTeach,set:viewSet,tcheck:viewTCheck}[S.tab]||viewDash;
  app.innerHTML=`<header><div><h1 class="notr">🏫 ${esc(mem.settings.school)}</h1><small>${admin?"Admin":"Teacher"} · Demo</small></div><div class="row" style="flex-wrap:nowrap">${langSel()}${!admin?'<button class="btn sec sm" onclick="logout()">Logout</button>':''}</div></header><main>${v()}</main>
  ${tabs.length>1?`<nav>${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("")}</nav>`:""}`;

}
